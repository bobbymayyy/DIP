# DIPx ESXi 8 kickstart template. Render with build-esxi-iso.sh.
vmaccepteula
rootpw --iscrypted @@ESXI_ROOTPW_HASH@@

# WARNING: destructive. The builder requires CONFIRM_DISK_WIPE=YES before rendering.
install --firstdisk=@@INSTALL_TARGET@@ --overwritevmfs

network --bootproto=static --ip=@@ESXI_IP@@ --netmask=@@ESXI_NETMASK@@ --gateway=@@ESXI_GATEWAY@@ --nameserver=@@ESXI_DNS@@ --hostname=@@ESXI_HOSTNAME@@

reboot

%firstboot --interpreter=busybox
exec 1>/var/log/dipx-firstboot.log 2>&1
[ "@@DEBUG@@" = "1" ] && set -x

VOL_BASE="/vmfs/volumes"
REPO_LABEL="@@REPO_LABEL@@"
REPO_BASE="${VOL_BASE}/${REPO_LABEL}"
DS_LABEL="@@DATASTORE_LABEL@@"
DS_BASE="${VOL_BASE}/${DS_LABEL}"
VM_NAME="@@PROV_VM_NAME@@"
PG_MGT="@@MGMT_PORTGROUP@@"
PORTGROUPS="@@PORTGROUPS@@"
NTP_SERVER="@@NTP_SERVER@@"
ENABLE_SSH="@@ENABLE_SSH@@"
VMS="${DS_BASE}/vms"
VM_DIR="${VMS}/${VM_NAME}"
PROV_ISO_RELATIVE="@@PROV_ISO_RELATIVE@@"
PROV_ISO="${REPO_BASE}/${PROV_ISO_RELATIVE}"

log(){ echo "DIPx[$(date +%H:%M:%S)] $*"; }

mount_repo() {
  esxcli storage filesystem list | awk -v L="$REPO_LABEL" '$2==L{f=1} END{exit !f}' && {
    log "$REPO_LABEL already mounted"
    return 0
  }

  /etc/init.d/usbarbitrator status 2>/dev/null | grep -qi running && /etc/init.d/usbarbitrator stop >/dev/null 2>&1 || true
  chkconfig usbarbitrator off
  esxcli storage core adapter rescan --all >/dev/null 2>&1 || true

  for i in 1 2 3 4 5 6; do
    esxcli storage filesystem mount -l "$REPO_LABEL" >/dev/null 2>&1 || true
    if esxcli storage filesystem list | awk -v L="$REPO_LABEL" '$2==L{f=1} END{exit !f}'; then
      log "$REPO_LABEL mounted"
      return 0
    fi
    sleep 10
  done

  log "failed to mount $REPO_LABEL"
  return 1
}

ensure_net(){
  esxcli system ntp set -s "$NTP_SERVER"
  esxcli system ntp set -e true
  /etc/init.d/ntpd restart >/dev/null 2>&1 || true

  if [ "$ENABLE_SSH" = "1" ]; then
    vim-cmd hostsvc/enable_ssh >/dev/null 2>&1 || true
    vim-cmd hostsvc/start_ssh >/dev/null 2>&1 || true
    log "SSH enabled by configuration"
  else
    vim-cmd hostsvc/stop_ssh >/dev/null 2>&1 || true
    vim-cmd hostsvc/disable_ssh >/dev/null 2>&1 || true
    log "SSH left disabled"
  fi

  VSW="$(esxcli network vswitch standard list | awk '/^vSwitch/{print $1; exit}')"
  [ -z "$VSW" ] && VSW="vSwitch0"

  OLDIFS="$IFS"
  IFS=','
  for item in $PORTGROUPS; do
    name="${item%:*}"
    vlan="${item##*:}"
    esxcli network vswitch standard portgroup add -v "$VSW" -p "$name" >/dev/null 2>&1 || true
    esxcli network vswitch standard portgroup set -p "$name" -v "$vlan" >/dev/null 2>&1 || true
  done
  IFS="$OLDIFS"
}

vm_exists(){ vim-cmd vmsvc/getallvms | awk '{print $1,$2}' | grep -q " ${VM_NAME}$"; }

create_provisioner_vm(){
  [ -d "$DS_BASE" ] || { log "Missing datastore: $DS_BASE"; return 1; }
  [ -f "$PROV_ISO" ] || { log "Missing ISO: $PROV_ISO"; return 1; }

  mkdir -p "$VM_DIR"
  [ -f "${VM_DIR}/${VM_NAME}.vmdk" ] || vmkfstools -c 30G -d thin "${VM_DIR}/${VM_NAME}.vmdk"

  cat > "${VM_DIR}/${VM_NAME}.vmx" <<VMXEOF
.encoding = "UTF-8"
config.version = "8"
virtualHW.version = "21"
nvram = "${VM_NAME}.nvram"
svga.present = "TRUE"
pciBridge0.present = "TRUE"
pciBridge4.present = "TRUE"
pciBridge4.virtualDev = "pcieRootPort"
pciBridge4.functions = "8"
pciBridge5.present = "TRUE"
pciBridge5.virtualDev = "pcieRootPort"
pciBridge5.functions = "8"
pciBridge6.present = "TRUE"
pciBridge6.virtualDev = "pcieRootPort"
pciBridge6.functions = "8"
pciBridge7.present = "TRUE"
pciBridge7.virtualDev = "pcieRootPort"
pciBridge7.functions = "8"
vmci0.present = "TRUE"
hpet0.present = "TRUE"
floppy0.present = "FALSE"
numvcpus = "2"
memSize = "4096"
bios.bootRetry.delay = "10"
firmware = "efi"
scsi0.virtualDev = "pvscsi"
scsi0.present = "TRUE"
sata0.present = "TRUE"
scsi0:0.deviceType = "scsi-hardDisk"
scsi0:0.fileName = "${VM_NAME}.vmdk"
scsi0:0.present = "TRUE"
ethernet0.virtualDev = "vmxnet3"
ethernet0.networkName = "${PG_MGT}"
ethernet0.addressType = "generated"
ethernet0.present = "TRUE"
sata0:0.deviceType = "cdrom-image"
sata0:0.fileName = "${PROV_ISO}"
sata0:0.present = "TRUE"
displayName = "${VM_NAME}"
guestOS = "oraclelinux9-64"
tools.upgrade.policy = "manual"
tools.syncTime = "FALSE"
VMXEOF

  if ! vm_exists; then
    VMID=$(vim-cmd solo/registervm "${VM_DIR}/${VM_NAME}.vmx")
    log "registered ${VM_NAME} as VMID ${VMID}"
  else
    VMID=$(vim-cmd vmsvc/getallvms | awk -v n="${VM_NAME}" '$0 ~ (" " n "$"){print $1}')
    vim-cmd vmsvc/reload "$VMID" >/dev/null 2>&1 || true
    log "${VM_NAME} already registered as VMID ${VMID}"
  fi

  vim-cmd vmsvc/power.on "$VMID" >/dev/null 2>&1 || true
  log "created and powered on ${VM_NAME}"
}

ensure_net
if mount_repo; then
  log "repo ready at ${REPO_BASE}; creating provisioning VM"
  create_provisioner_vm || log "provisioner creation failed"
else
  log "repo not available; skipping provisioning VM creation"
fi
